<script>
/* The page asks for a shared database through window.claude.use("db"). Here that is Firebase. */
window.__dbReady=new Promise(function(r){ window.__resolveDb=r; });
if(!window.claude) window.claude={ use:function(n){ return n==="db"?window.__dbReady:Promise.resolve(null); } };
setTimeout(function(){ window.__resolveDb(null); },10000);
</script>
<script src="firebase-config.js"></script>
<script type="module">
(async()=>{
  const cfg=window.FIREBASE_CONFIG, done=v=>window.__resolveDb(v);
  const status=s=>{ window.__liveState=s; if(window.__setLive) window.__setLive(s); };
  if(!cfg||!cfg.databaseURL||String(cfg.databaseURL).includes("YOUR_")){ done(null); return; }
  try{
    const V="10.14.1";
    const [{initializeApp},{getDatabase,ref,onValue,set,remove}]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`)]);
    const rtdb=getDatabase(initializeApp(cfg)), base="tg2026-v2";
    onValue(ref(rtdb,".info/connected"),s=>status(s.val()===true?"live":"offline"));
    done({
      collection:c=>({onSnapshot:cb=>onValue(ref(rtdb,base+"/"+c),snap=>{
        const v=snap.val()||{}; cb({docs:Object.entries(v).map(([id,d])=>({id,data:()=>d}))}); })}),
      doc:p=>{ const [c,id]=p.split("/"), r=ref(rtdb,base+"/"+c+"/"+id);
        return { set:v=>set(r,JSON.parse(JSON.stringify(v))), delete:()=>remove(r) }; }
    });
  }catch(e){ console.error("Firebase failed to load",e); done(null); }
})();
</script>

<style>

<body>
<header>
  <h1>Thanksgiving</h1>
  <div class="count" id="count">2026</div><span class="live" id="live"></span>
  <div class="prog"><div class="lbl"><span>Shopping</span><b id="stShop">0 / 0</b></div><div class="bar"><i id="brShop"></i></div></div>
</header>
<nav><div class="seg" id="tabs"><i class="thumb"></i>
  <button data-tab="schedule" class="on">Schedule</button>
  <button data-tab="shopping">Shopping</button>
  <button data-tab="games">Games</button>
  <button data-tab="topics">Topics</button>
</div></nav>
<main>
  <div id="notice" class="notice hide"></div>

  <section id="v-schedule"></section>

  <section id="v-shopping" class="hide">
    <div class="card">
      <div class="filters">
        <input id="q" type="search" placeholder="🔍 Search the list">
        <select id="fStore"><option value="all">All stores</option></select>
        <select id="fState"><option value="all">Everything</option><option value="todo">To buy</option><option value="done">Bought</option></select>
      </div>
      <div class="adder" data-adder="shop">
        <button class="plus" data-act="toggleAdd"><span class="pi">＋</span> Add an item</button>
        <div class="addwrap"><div class="addinner"><div class="addrow">
          <input type="text" data-new="text" placeholder="Item">
          <select data-new="store" id="addStore"></select>
          <input class="qty" data-new="qty" placeholder="Qty">
          <input class="whoin" data-new="who" list="names" placeholder="Who's doing it?">
          <button class="add" data-act="addP">Add</button>
        </div></div></div>
      </div>
    </div>
    <div id="shopList"></div>
  </section>

  <section id="v-games" class="hide">
    <div class="card picker">
      <button class="big" data-act="spinG">🎲 Pick a game for us</button>
      <div class="result" id="gResult"></div>
    </div>
    <div class="card">
      <div id="gList"></div>
      <div class="adder" data-adder="games">
        <button class="plus" data-act="toggleAdd"><span class="pi">＋</span> Add a game</button>
        <div class="addwrap"><div class="addinner"><div class="addrow">
          <input type="text" data-new="text" placeholder="Game name">
          <button class="add" data-act="addG">Add</button>
        </div></div></div>
      </div>
    </div>
  </section>

  <section id="v-topics" class="hide">
    <div class="card picker">
      <button class="big" data-act="spinT">💬 Surprise me</button>
      <div class="result" id="tResult"></div>
    </div>
    <div class="card">

function burst(el,n){
  if(reduced()||!el) return;
  const r=el.getBoundingClientRect(), fx=$("#fx"), em=["🎉","🍂","🦃","✨","🥧","🍁","🧡","💛","💜","💚"];
  n=n||12;
  for(let i=0;i<n;i++){
    const s=document.createElement("span");
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top+r.height/2)+"px";
    s.style.setProperty("--dx",(Math.random()*240-120)+"px");
    s.style.setProperty("--dy",(-60-Math.random()*160)+"px");
    s.style.setProperty("--r",(Math.random()*360-180)+"deg");
    fx.appendChild(s); setTimeout(()=>s.remove(),1200);
  }
}
function spin(list,out){
  if(!list.length){ out.textContent="Add some first!"; return; }
  let n=0; const total=16+Math.floor(Math.random()*6);
  const step=()=>{
    out.textContent=list[Math.floor(Math.random()*list.length)]; out.classList.add("spinning"); n++;
    if(n<total) setTimeout(step,55+n*13);
    else{ out.textContent=list[Math.floor(Math.random()*list.length)]; out.classList.remove("spinning"); out.classList.remove("land"); void out.offsetWidth; out.classList.add("land"); burst(out,16); }
  };
  step();
}

  return null;
}

let _cv; function textW(el,txt){ _cv=_cv||document.createElement("canvas").getContext("2d"); _cv.font=getComputedStyle(el).font; return _cv.measureText(txt).width; }

  renderAllInner();
  Object.entries(keep).forEach(([k,v])=>{ const el=findByKey(k); if(el&&el.value!==v) el.value=v; });
  autosize();
  if(f){ const el=findByKey(f.k); if(el&&el.tagName!=="SELECT"){ if(el.value!==f.v) el.value=f.v; el.focus({preventScroll:true}); try{ el.setSelectionRange(f.s,f.e); }catch(e){} autosize(); } }
}
function renderAllInner(){
  [renderCount,renderStats,renderSched,renderShop,renderGames,renderTopics].forEach(f=>{ try{ f(); }catch(e){ console.error(f.name,e); } });
  fresh.clear(); freshCheck.clear();
}
function requestRender(){ const a=document.activeElement; if(a&&a.matches&&a.matches("select,input.who")) pending=true; else renderAll(); }

// ---------- tabs ----------
function showTab(t,fromHash){
  if(!TABS.includes(t)) t="schedule";
  TABS.forEach(k=>$("#v-"+k).classList.toggle("hide",k!==t));
  document.querySelectorAll("#tabs button[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  $("#tabs").style.setProperty("--idx",TABS.indexOf(t));
  $("#tabs").style.setProperty("--tabc",TABCOL[TABS.indexOf(t)]);
  document.documentElement.style.setProperty("--accent",TABCOL[TABS.indexOf(t)]);
  const sec=$("#v-"+t); sec.classList.remove("enter");
  sec.querySelectorAll(".card,.store-h,.mini").forEach((el,i)=>el.style.setProperty("--d",Math.min(i*0.04,0.4)+"s"));
  void sec.offsetWidth; sec.classList.add("enter"); setTimeout(()=>sec.classList.remove("enter"),900);
  if(!fromHash){ try{ location.hash=t; }catch(e){} }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>showTab(location.hash.slice(1),true));

// ---------- events ----------
function refocus(key){ const i=document.querySelector(`[data-adder="${key}"] input[data-new="text"]`); if(i) i.focus(); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ showTab(b.dataset.tab); return; }
  const row=b.closest(".addrow"), val=k=>row?row.querySelector(`[data-new="${k}"]`).value.trim():"";
  switch(b.dataset.act){
    case "del":
      if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="sure?"; setTimeout(()=>{delete b.dataset.armed;b.textContent="×";},3000); return; }
      { const rowEl=b.closest(".row"); if(rowEl) rowEl.classList.add("out"); const c=b.dataset.c,id=b.dataset.id; setTimeout(()=>remove(c,id),rowEl?230:0); } break;
    case "pickDay":{ const d=+b.dataset.day; selDay=(d===selDay||d<0)?-1:d; renderAll(); break; }
    case "toggleAdd":{
      const a=b.closest(".adder"), k=a.dataset.adder, open=a.classList.toggle("open");
      if(open) openAdd.add(k); else openAdd.delete(k);
      if(open) setTimeout(()=>{ const i=a.querySelector("input[data-new=text]"); if(i) i.focus(); },280);
      break; }
    case "addS":{ if(!val("text")) return; add("plan",{kind:"dish",day:+b.dataset.day,meal:val("meal"),text:val("text")}); refocus("day"+b.dataset.day); break; }
    case "addT":{ if(!val("text")) return; add("items",{kind:"s",day:-1,cat:"Topics",text:val("text")}); row.querySelector('[data-new="text"]').value=""; refocus("topics"); break; }
    case "addG":{ if(!val("text")) return; add("games",{kind:"game",name:val("text")}); row.querySelector('[data-new="text"]').value=""; refocus("games"); break; }
    case "addP":{ if(!val("text")) return; add("items",{kind:"p",store:val("store"),text:val("text"),owner:val("who"),ownerSet:!!val("who"),qty:val("qty"),done:false}); ["text","qty","who"].forEach(k=>row.querySelector(`[data-new="${k}"]`).value=""); burst(b,6); refocus("shop"); break; }
    case "addPS":{
      if(!val("text")) return;
      add("items",{kind:"p",store:b.dataset.store,text:val("text"),owner:val("who"),ownerSet:!!val("who"),qty:val("qty"),done:false});
      burst(b,6); refocus(b.closest(".adder").dataset.adder); break; }
    case "copyList": copyText(listText()); break;
    case "backup": downloadBackup(); break;
    case "spinG": spin(gameRows().map(g=>g.name),$("#gResult")); break;
    case "spinT": spin(topicRows().map(r=>r.text),$("#tResult")); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.closest(".addrow")&&e.target.matches("input")) e.target.closest(".addrow").querySelector("button[data-act]").click();
  if(e.key==="Enter"&&e.target.matches("textarea.edit")){ e.preventDefault(); e.target.blur(); }
  if(e.key==="Enter"&&e.target.matches("input.edit,.stay input,input.who")) e.target.blur();
  if(e.key==="Escape"){ const a=e.target.closest&&e.target.closest(".adder"); if(a){ a.classList.remove("open"); openAdd.delete(a.dataset.adder); e.target.blur(); } }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fStore"){ fStore=t.value; renderShop(); return; }
  if(t.id==="fState"){ fState=t.value; renderShop(); return; }
  if(t.tagName==="SELECT"&&t.classList.contains("who")){
    if(t.value==="__other"){
      const inp=document.createElement("input"); inp.className="who"; inp.setAttribute("list","names"); inp.placeholder="type a name"; inp.style.width="11ch";
      Object.entries(t.dataset).forEach(([k,v])=>inp.dataset[k]=v);
      t.replaceWith(inp); inp.focus(); inp.addEventListener("blur",()=>{ setTimeout(()=>{ if(!inp.value.trim()) renderAll(); },200); }); return;
    }
    if(t.value==="__none") t.value="";
  }
  if(t.dataset.storewho){
    const st=t.dataset.storewho, prev=storeWho(st);
    // items that still carry the old buyer follow the store; items someone set by hand are left alone
    shopRows().filter(r=>r.store===st&&!r.ownerSet&&r.owner&&r.owner===prev).forEach(r=>{ const n={...D.items[r.id],owner:"",at:Date.now()}; D.items[r.id]=n; persist("items",r.id,n); });
    upsert("plan",whoKey(st),{kind:"storewho",store:st,name:t.value.trim()}); return; }
  if(t.dataset.c&&t.dataset.f){
    const val=t.type==="checkbox"?t.checked:t.value.trim();
    if(t.type==="checkbox"&&val) burst(t,10);
    const c=t.dataset.c, id=t.dataset.id;
    if(!D[c][id]&&t.dataset.kind==="stay") D[c][id]={kind:"stay",day:+t.dataset.day,place:""};
    upsert(c,id,t.dataset.ownerset?{[t.dataset.f]:val,ownerSet:true}:{[t.dataset.f]:val});
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ q=e.target.value.trim().toLowerCase(); renderShop(); } });
document.addEventListener("focusout",()=>{ if(pending){ pending=false; setTimeout(()=>{ const a=document.activeElement; if(!a||!a.matches||!a.matches("select,input.who")) renderAll(); },150); } });
document.addEventListener("input",e=>{ if(e.target.matches&&e.target.matches(".stay input")) fitStay(e.target); if(e.target.matches&&e.target.matches("textarea.edit")){ e.target.style.height="auto"; e.target.style.height=e.target.scrollHeight+"px"; } });
window.addEventListener("resize",autosize); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(autosize);

// ---------- start ----------
function listen(c){
  db.collection(c).onSnapshot(snap=>{
    const next={};
    (snap.docs||[]).forEach(d=>{ next[d.id]=typeof d.data==="function"?d.data():d.data; });
    if(!next._seed){
      D[c]={...SEEDS[c](),...next};
      if(!seeding[c]){
        seeding[c]=true;
        Object.entries({...SEEDS[c](),_seed:{kind:"meta",at:Date.now()}}).forEach(([id,v])=>db.doc(c+"/"+id).set(v).catch(()=>{}));
      }
    } else D[c]=next;
    requestRender();
  });
}
async function init(){
  $("#names").innerHTML=NAMES.map(n=>`<option value="${esc(n)}">`).join("");
  const stores=STORES.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("");
  $("#fStore").insertAdjacentHTML("beforeend",stores);
  $("#addStore").innerHTML=stores;
  showTab(location.hash.slice(1),true);
  Object.keys(SEEDS).forEach(c=>D[c]=SEEDS[c]());
  renderAll();

  let api=null;
  try{ api=window.claude?await window.claude.use("db"):null; }catch(e){ api=null; }
  if(!api){
    window.__setLive("local");
    showNotice("Can't reach the shared list right now, so changes are saved on this device only.",true);
    Object.keys(SEEDS).forEach(c=>{ try{ const s=JSON.parse(localStorage.getItem(LK(c))); if(s) D[c]=s; }catch(e){} });
    renderAll(); return;
  }
  db=api;
  Object.keys(SEEDS).forEach(listen);
}
init();
</script>
